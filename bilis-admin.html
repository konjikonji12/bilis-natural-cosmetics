<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bili’s Natural Cosmetics — Administracija</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --bg:#f6f4ef;
  --card:#ffffff;
  --ink:#171717;
  --muted:#777;
  --line:#ddd8cf;
  --gold:#b68b35;
  --danger:#9e2b2b;
  --ok:#23612a;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

.wrap{
  max-width:1180px;
  margin:auto;
  padding:32px 20px 60px;
}

.brand{
  letter-spacing:.14em;
  font-size:13px;
}

.title{
  font-family:Georgia,serif;
  font-size:48px;
  margin:8px 0 28px;
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:22px;
  padding:26px;
  box-shadow:0 8px 30px #00000008;
}

.login{
  max-width:720px;
  margin:50px auto;
}

h2{
  font-family:Georgia,serif;
  font-size:32px;
  margin:0 0 10px;
}

.muted{color:var(--muted)}

label{
  display:block;
  font-size:12px;
  letter-spacing:.12em;
  margin:16px 0 7px;
}

input,
textarea{
  width:100%;
  padding:13px 14px;
  border:1px solid #cfc9bf;
  border-radius:12px;
  background:#fff;
  font:inherit;
}

textarea{
  min-height:90px;
  resize:vertical;
}

button{
  border:0;
  border-radius:12px;
  padding:12px 18px;
  background:#171717;
  color:white;
  font-weight:700;
  cursor:pointer;
}

button:disabled{
  opacity:.55;
  cursor:not-allowed;
}

button.secondary{
  background:#eee;
  color:#171717;
}

button.gold{
  background:var(--gold);
}

button.danger{
  background:var(--danger);
}

button.linkbtn{
  background:transparent;
  color:#171717;
  padding:12px 4px;
  text-decoration:underline;
}

.actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:20px;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:22px;
}

.row{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:16px;
}

.badge{
  display:inline-block;
  padding:7px 10px;
  border-radius:999px;
  background:#f0e8d8;
  font-size:12px;
}

.hidden{
  display:none!important;
}

.status{
  margin-top:14px;
  padding:12px 14px;
  border-radius:12px;
  white-space:pre-wrap;
  word-break:break-word;
}

.error{
  background:#f9e5e5;
  color:#8d1d1d;
}

.ok{
  background:#e8f4e9;
  color:#23612a;
}

.info{
  background:#eeeae1;
  color:#333;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:18px;
}

th,
td{
  text-align:left;
  padding:14px 10px;
  border-bottom:1px solid var(--line);
  vertical-align:middle;
}

th{
  font-size:12px;
  letter-spacing:.08em;
  text-transform:uppercase;
  color:#666;
}

.thumb{
  width:58px;
  height:58px;
  border-radius:10px;
  object-fit:cover;
  background:#eee;
  display:block;
  margin-bottom:6px;
}

.stock-low{
  font-weight:700;
}

.switch{
  display:flex;
  gap:8px;
  align-items:center;
  margin-top:16px;
}

.switch input{
  width:auto;
}

.modal{
  position:fixed;
  inset:0;
  background:#0007;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:18px;
  z-index:999;
}

.modal .card{
  width:min(760px,100%);
  max-height:92vh;
  overflow:auto;
}

@media(max-width:700px){
  .wrap{padding:22px 14px}
  .title{font-size:38px}
  .row{grid-template-columns:1fr}
  table{font-size:13px}
}
</style>
</head>

<body>

<div class="wrap">

  <div class="brand">BILI’S NATURAL COSMETICS</div>
  <div class="title">Administracija</div>

  <section id="login" class="card login">

    <h2>Prijava</h2>

    <p class="muted">
      Samo vlasnik može menjati proizvode, cene i zalihe.
    </p>

    <label>EMAIL</label>
    <input
      id="email"
      type="email"
      autocomplete="username"
      value="duricbiljana.diki@gmail.com"
    >

    <label>LOZINKA</label>
    <input
      id="password"
      type="password"
      autocomplete="current-password"
    >

    <div class="actions">
      <button id="loginBtn">Prijavi me</button>

      <button
        id="forgotBtn"
        class="linkbtn"
        type="button"
      >
        Zaboravljena lozinka?
      </button>
    </div>

    <div id="loginMsg" class="status hidden"></div>

  </section>


  <section id="dash" class="hidden">

    <div class="top">

      <div>
        <span class="badge">Vlasnički pristup</span>
        <div
          id="userEmail"
          class="muted"
          style="margin-top:8px"
        ></div>
      </div>

      <button
        id="logoutBtn"
        class="secondary"
      >
        Odjavi se
      </button>

    </div>

    <div class="card">

      <div class="top">

        <div>
          <h2>Proizvodi</h2>
          <div class="muted">
            Cena, zaliha i vidljivost proizvoda.
          </div>
        </div>

        <button
          id="addBtn"
          class="gold"
        >
          + Dodaj proizvod
        </button>

      </div>

      <div id="dashMsg" class="status hidden"></div>

      <div style="overflow:auto">

        <table>
          <thead>
            <tr>
              <th>Proizvod</th>
              <th>Cena</th>
              <th>Zaliha</th>
              <th>Aktivan</th>
              <th>Radnja</th>
            </tr>
          </thead>

          <tbody id="productsBody"></tbody>
        </table>

      </div>

    </div>

  </section>

</div>


<div id="modal" class="modal hidden">

  <div class="card">

    <div class="top">
      <h2 id="modalTitle">Novi proizvod</h2>

      <button
        id="closeBtn"
        class="secondary"
        type="button"
      >
        Zatvori
      </button>
    </div>

    <input id="pid" type="hidden">

    <div class="row">

      <div>
        <label>NAZIV — SRPSKI</label>
        <input id="name_sr">
      </div>

      <div>
        <label>NAZIV — NEMAČKI</label>
        <input id="name_de">
      </div>

      <div>
        <label>KATEGORIJA</label>
        <input id="category">
      </div>

      <div>
        <label>VELIČINA</label>
        <input id="size">
      </div>

      <div>
        <label>CENA (CHF)</label>
        <input id="price_chf" type="number" step="0.01">
      </div>

      <div>
        <label>ZALIHA</label>
        <input id="stock_qty" type="number" step="1">
      </div>

      <div>
        <label>REDOSLED</label>
        <input id="sort_order" type="number" step="1">
      </div>

      <div>
        <label>SLIKA — URL</label>
        <input id="image">
      </div>

    </div>

    <label>OPIS — SRPSKI</label>
    <textarea id="description_sr"></textarea>

    <label>OPIS — NEMAČKI</label>
    <textarea id="description_de"></textarea>

    <label class="switch">
      <input id="active" type="checkbox">
      Proizvod je aktivan
    </label>

    <label class="switch">
      <input id="featured" type="checkbox">
      Istaknuti proizvod
    </label>

    <div class="actions">

      <button id="saveBtn">
        Sačuvaj
      </button>

      <button
        id="deleteBtn"
        class="danger"
      >
        Obriši
      </button>

    </div>

  </div>

</div>


<script>

/* ==========================================
   BILI'S NATURAL COSMETICS — ADMIN
   ========================================== */

const SUPABASE_URL =
  "https://enzcsfhtduucaggjamnx.supabase.co";

/*
  OVDE NALEPI PUBLISHABLE KEY KOJI SI
  KOPIRALA IZ SUPABASE-A.
*/
const SUPABASE_PUBLISHABLE_KEY =
  "OVDE_NALEPI_PUBLISHABLE_KEY";

const ADMIN_EMAIL =
  "duricbiljana.diki@gmail.com";

const RESET_PASSWORD_URL =
  "https://konjikonji12.github.io/bilis-natural-cosmetics/reset-password.html";


const $ = id =>
  document.getElementById(id);


function showMessage(
  el,
  text,
  type="error"
){
  el.textContent=text;
  el.className=
    "status " + type;
  el.classList.remove("hidden");
}


function clearMessage(el){
  el.textContent="";
  el.classList.add("hidden");
}


/* ==========================================
   PROVERA KONFIGURACIJE
   ========================================== */

function configOK(){

  if(
    !SUPABASE_PUBLISHABLE_KEY ||
    SUPABASE_PUBLISHABLE_KEY.includes(
      "OVDE_NALEPI"
    )
  ){

    showMessage(
      $("loginMsg"),
      "Publishable key još nije unet u bilis-admin.html."
    );

    $("loginBtn").disabled=true;
    $("forgotBtn").disabled=true;

    return false;
  }

  return true;
}


/* ==========================================
   SUPABASE KLIJENT
   ========================================== */

let supabaseClient=null;


function createSupabaseClient(){

  if(!configOK()){
    return null;
  }

  try{

    if(
      !window.supabase ||
      !window.supabase.createClient
    ){
      throw new Error(
        "Supabase biblioteka nije učitana."
      );
    }

    supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY,
        {
          auth:{
            persistSession:true,
            autoRefreshToken:true,
            detectSessionInUrl:true
          }
        }
      );

    return supabaseClient;

  }catch(error){

    showMessage(
      $("loginMsg"),
      "Greška pri pokretanju Supabase veze: "
      + error.message
    );

    return null;
  }
}


/* ==========================================
   TEST VEZE
   ========================================== */

async function testConnection(){

  clearMessage(
    $("loginMsg")
  );

  if(!supabaseClient){
    return false;
  }

  try{

    const controller =
      new AbortController();

    const timer =
      setTimeout(
        ()=>controller.abort(),
        10000
      );

    const response =
      await fetch(
        SUPABASE_URL + "/auth/v1/health",
        {
          method:"GET",
          headers:{
            apikey:
              SUPABASE_PUBLISHABLE_KEY
          },
          signal:
            controller.signal
        }
      );

    clearTimeout(timer);

    if(!response.ok){

      throw new Error(
        "Supabase odgovara HTTP "
        + response.status
      );
    }

    return true;

  }catch(error){

    let text =
      error?.message ||
      String(error);

    if(
      error?.name ===
      "AbortError"
    ){
      text =
        "Veza sa Supabase-om je istekla.";
    }

    showMessage(
      $("loginMsg"),
      "Ne mogu da uspostavim vezu sa Supabase-om.\n"
      + text
      + "\n\nAko koristiš Safari, privremeno isključi content blocker/VPN za ovu stranicu i pokušaj ponovo."
    );

    return false;
  }
}


/* ==========================================
   PRIJAVA
   ========================================== */

async function login(){

  clearMessage(
    $("loginMsg")
  );

  const email =
    $("email").value.trim();

  const password =
    $("password").value;


  if(!email || !password){

    showMessage(
      $("loginMsg"),
      "Unesi email i lozinku."
    );

    return;
  }


  $("loginBtn").disabled=true;
  $("loginBtn").textContent=
    "Prijavljivanje…";


  try{

    const connected =
      await testConnection();

    if(!connected){
      return;
    }


    const {
      data,
      error
    } =
      await supabaseClient
        .auth
        .signInWithPassword({
          email,
          password
        });


    if(error){
      throw error;
    }


    if(!data?.user){

      throw new Error(
        "Supabase nije vratio korisnički nalog."
      );
    }


    if(
      (
        data.user.email ||
        ""
      ).toLowerCase()
      !==
      ADMIN_EMAIL.toLowerCase()
    ){

      await supabaseClient
        .auth
        .signOut();

      throw new Error(
        "Ovaj nalog nema administratorski pristup."
      );
    }


    $("password").value="";

    await showDashboard();


  }catch(error){

    showMessage(
      $("loginMsg"),
      "Prijava nije uspela:\n"
      + (
        error?.message ||
        String(error)
      )
    );

  }finally{

    $("loginBtn").disabled=false;
    $("loginBtn").textContent=
      "Prijavi me";
  }
}


/* ==========================================
   RESET LOZINKE
   ========================================== */

async function forgotPassword(){

  clearMessage(
    $("loginMsg")
  );

  const email =
    $("email").value.trim();


  if(!email){

    showMessage(
      $("loginMsg"),
      "Unesi email adresu."
    );

    return;
  }


  $("forgotBtn").disabled=true;


  try{

    const connected =
      await testConnection();

    if(!connected){
      return;
    }


    const {
      error
    } =
      await supabaseClient
        .auth
        .resetPasswordForEmail(
          email,
          {
            redirectTo:
              RESET_PASSWORD_URL
          }
        );


    if(error){
      throw error;
    }


    showMessage(
      $("loginMsg"),
      "Email za promenu lozinke je uspešno poslat.",
      "ok"
    );


  }catch(error){

    showMessage(
      $("loginMsg"),
      "Reset lozinke nije poslat:\n"
      + (
        error?.message ||
        String(error)
      )
    );

  }finally{

    $("forgotBtn").disabled=false;
  }
}


/* ==========================================
   ODJAVA
   ========================================== */

async function logout(){

  try{
    await supabaseClient.auth.signOut();
  }catch{}

  $("dash")
    .classList
    .add("hidden");

  $("login")
    .classList
    .remove("hidden");

  clearMessage(
    $("dashMsg")
  );
}


/* ==========================================
   DASHBOARD
   ========================================== */

async function showDashboard(){

  const {
    data,
    error
  } =
    await supabaseClient
      .auth
      .getSession();


  if(error){
    throw error;
  }


  const session =
    data?.session;


  if(!session){

    $("dash")
      .classList
      .add("hidden");

    $("login")
      .classList
      .remove("hidden");

    return;
  }


  const email =
    (
      session.user?.email ||
      ""
    ).toLowerCase();


  if(
    email !==
    ADMIN_EMAIL.toLowerCase()
  ){

    await logout();
    return;
  }


  $("login")
    .classList
    .add("hidden");

  $("dash")
    .classList
    .remove("hidden");

  $("userEmail")
    .textContent =
      session.user.email;

  await loadProducts();
}


/* ==========================================
   UČITAVANJE PROIZVODA
   ========================================== */

async function loadProducts(){

  const body =
    $("productsBody");


  body.innerHTML =
    "<tr><td colspan='5'>Učitavanje…</td></tr>";


  clearMessage(
    $("dashMsg")
  );


  try{

    const {
      data,
      error
    } =
      await supabaseClient
        .from("products")
        .select("*")
        .order(
          "sort_order",
          {
            ascending:true
          }
        );


    if(error){
      throw error;
    }


    renderProducts(
      data || []
    );


  }catch(error){

    body.innerHTML="";

    showMessage(
      $("dashMsg"),
      "Ne mogu da učitam proizvode:\n"
      + (
        error?.message ||
        String(error)
      )
    );
  }
}


/* ==========================================
   PRIKAZ PROIZVODA
   ========================================== */

function renderProducts(data){

  const body =
    $("productsBody");


  if(!data.length){

    body.innerHTML =
      "<tr><td colspan='5'>Nema proizvoda.</td></tr>";

    return;
  }


  body.innerHTML =
    data.map(p=>{

      const name =
        p.name_sr ||
        p.name_de ||
        p.name ||
        "Bez naziva";

      const image =
        p.image || "";

      const price =
        p.price_chf != null
        ?
        Number(
          p.price_chf
        ).toFixed(2)
        + " CHF"
        :
        "—";

      return `
        <tr>

          <td>

            ${
              image
              ?
              `<img
                class="thumb"
                src="${escapeHTML(image)}"
                onerror="this.style.display='none'"
              >`
              :
              ""
            }

            <strong>
              ${escapeHTML(name)}
            </strong>

            <div class="muted">
              ${escapeHTML(p.size || "")}
            </div>

          </td>

          <td>${price}</td>

          <td
            class="${
              Number(
                p.stock_qty || 0
              ) <= 3
              ?
              "stock-low"
              :
              ""
            }"
          >
            ${p.stock_qty ?? 0}
          </td>

          <td>
            ${
              p.active
              ?
              "Da"
              :
              "Ne"
            }
          </td>

          <td>
            <button
              class="secondary"
              data-id="${escapeHTML(p.id)}"
            >
              Uredi
            </button>
          </td>

        </tr>
      `;

    }).join("");


  document
    .querySelectorAll(
      "[data-id]"
    )
    .forEach(button=>{

      button.onclick=()=>{

        const id =
          button.dataset.id;

        const product =
          data.find(
            p =>
              String(p.id) ===
              String(id)
          );

        if(product){
          openModal(product);
        }
      };

    });
}


/* ==========================================
   MODAL
   ========================================== */

function openModal(p={}){

  $("modalTitle")
    .textContent =
      p.id
      ?
      "Uredi proizvod"
      :
      "Novi proizvod";


  $("pid").value =
    p.id || "";


  const fields=[
    "name_sr",
    "name_de",
    "category",
    "size",
    "price_chf",
    "stock_qty",
    "sort_order",
    "image",
    "description_sr",
    "description_de"
  ];


  fields.forEach(field=>{

    $(field).value =
      p[field] ??
      (
        field === "sort_order"
        ?
        0
        :
        ""
      );

  });


  $("active").checked =
    p.id
    ?
    p.active !== false
    :
    true;


  $("featured").checked =
    !!p.featured;


  $("deleteBtn")
    .style
    .display =
      p.id
      ?
      "inline-block"
      :
      "none";


  $("modal")
    .classList
    .remove("hidden");
}


function closeModal(){

  $("modal")
    .classList
    .add("hidden");
}


/* ==========================================
   ČUVANJE PROIZVODA
   ========================================== */

async function saveProduct(){

  $("saveBtn").disabled=true;


  const payload={};


  [
    "name_sr",
    "name_de",
    "category",
    "size",
    "image",
    "description_sr",
    "description_de"
  ]
  .forEach(field=>{

    payload[field] =
      $(field).value.trim();

  });


  payload.price_chf =
    Number(
      $("price_chf").value || 0
    );


  payload.stock_qty =
    Number(
      $("stock_qty").value || 0
    );


  payload.sort_order =
    Number(
      $("sort_order").value || 0
    );


  payload.active =
    $("active").checked;


  payload.featured =
    $("featured").checked;


  const id =
    $("pid").value;


  try{

    let query;


    if(id){

      query =
        supabaseClient
          .from("products")
          .update(payload)
          .eq("id",id);

    }else{

      query =
        supabaseClient
          .from("products")
          .insert(payload);

    }


    const {
      error
    } =
      await query;


    if(error){
      throw error;
    }


    closeModal();


    showMessage(
      $("dashMsg"),
      "Proizvod je uspešno sačuvan.",
      "ok"
    );


    await loadProducts();


  }catch(error){

    showMessage(
      $("dashMsg"),
      "Nije sačuvano:\n"
      + (
        error?.message ||
        String(error)
      )
    );

  }finally{

    $("saveBtn").disabled=false;
  }
}


/* ==========================================
   BRISANJE PROIZVODA
   ========================================== */

async function deleteProduct(){

  const id =
    $("pid").value;


  if(!id){
    return;
  }


  if(
    !confirm(
      "Da li sigurno želiš da obrišeš ovaj proizvod?"
    )
  ){
    return;
  }


  $("deleteBtn").disabled=true;


  try{

    const {
      error
    } =
      await supabaseClient
        .from("products")
        .delete()
        .eq("id",id);


    if(error){
      throw error;
    }


    closeModal();


    showMessage(
      $("dashMsg"),
      "Proizvod je obrisan.",
      "ok"
    );


    await loadProducts();


  }catch(error){

    showMessage(
      $("dashMsg"),
      "Nije obrisano:\n"
      + (
        error?.message ||
        String(error)
      )
    );

  }finally{

    $("deleteBtn").disabled=false;
  }
}


/* ==========================================
   ESCAPE HTML
   ========================================== */

function escapeHTML(value){

  return String(
    value ?? ""
  )
  .replace(
    /[&<>"']/g,
    char=>({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      "\"":"&quot;",
      "'":"&#039;"
    }[char])
  );
}


/* ==========================================
   DOGAĐAJI
   ========================================== */

$("loginBtn").onclick =
  login;

$("forgotBtn").onclick =
  forgotPassword;

$("logoutBtn").onclick =
  logout;

$("addBtn").onclick =
  ()=>openModal();

$("closeBtn").onclick =
  closeModal;

$("saveBtn").onclick =
  saveProduct;

$("deleteBtn").onclick =
  deleteProduct;


$("password")
  .addEventListener(
    "keydown",
    event=>{

      if(
        event.key === "Enter"
      ){
        login();
      }

    }
  );


/* ==========================================
   START
   ========================================== */

(async()=>{

  if(!configOK()){
    return;
  }

  createSupabaseClient();

  if(!supabaseClient){
    return;
  }

  try{

    const {
      data
    } =
      await supabaseClient
        .auth
        .getSession();


    if(data?.session){

      await showDashboard();

    }

  }catch(error){

    showMessage(
      $("loginMsg"),
      "Greška pri pokretanju administracije:\n"
      + (
        error?.message ||
        String(error)
      )
    );
  }

})();

</script>
