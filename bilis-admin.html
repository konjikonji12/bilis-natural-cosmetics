<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bili’s Natural Cosmetics — Administracija</title>

<style>
:root{
  --bg:#f6f4ef;
  --card:#fff;
  --ink:#171717;
  --muted:#777;
  --line:#ddd8cf;
  --gold:#b68b35;
  --danger:#9e2b2b;
  --ok:#23612a;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

.wrap{
  max-width:1180px;
  margin:auto;
  padding:32px 20px 60px;
}

.brand{
  letter-spacing:.14em;
  font-size:13px;
}

.title{
  font-family:Georgia,serif;
  font-size:48px;
  margin:8px 0 28px;
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:22px;
  padding:26px;
  box-shadow:0 8px 30px #00000008;
}

.login{
  max-width:720px;
  margin:50px auto;
}

.login h2,
.dash h2{
  font-family:Georgia,serif;
  font-size:32px;
  margin:0 0 10px;
}

.muted{color:var(--muted)}

label{
  display:block;
  font-size:12px;
  letter-spacing:.12em;
  margin:16px 0 7px;
}

input,
textarea,
select{
  width:100%;
  padding:13px 14px;
  border:1px solid #cfc9bf;
  border-radius:12px;
  background:#fff;
  font:inherit;
}

textarea{
  min-height:90px;
  resize:vertical;
}

button{
  border:0;
  border-radius:12px;
  padding:12px 18px;
  background:#171717;
  color:white;
  font-weight:700;
  cursor:pointer;
}

button:disabled{
  opacity:.55;
  cursor:not-allowed;
}

button.secondary{
  background:#eee;
  color:#171717;
}

button.gold{
  background:var(--gold);
}

button.danger{
  background:var(--danger);
}

button.linkbtn{
  background:transparent;
  color:#171717;
  padding:12px 4px;
  text-decoration:underline;
  font-weight:600;
}

.row{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:16px;
}

.actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:20px;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:22px;
}

.badge{
  display:inline-block;
  padding:7px 10px;
  border-radius:999px;
  background:#f0e8d8;
  font-size:12px;
}

.hidden{
  display:none!important;
}

.status{
  margin:14px 0;
  padding:12px 14px;
  border-radius:12px;
  background:#f2f0eb;
  white-space:pre-wrap;
  word-break:break-word;
}

.error{
  background:#f9e5e5;
  color:#8d1d1d;
}

.ok{
  background:#e8f4e9;
  color:var(--ok);
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:18px;
}

th,
td{
  text-align:left;
  padding:14px 10px;
  border-bottom:1px solid var(--line);
  vertical-align:middle;
}

th{
  font-size:12px;
  letter-spacing:.08em;
  text-transform:uppercase;
  color:#666;
}

.thumb{
  width:58px;
  height:58px;
  border-radius:10px;
  object-fit:cover;
  background:#eee;
  display:block;
  margin-bottom:6px;
}

.stock-low{
  font-weight:700;
}

.switch{
  display:flex;
  gap:8px;
  align-items:center;
  font-size:14px;
  margin-top:16px;
}

.switch input{
  width:auto;
}

.modal{
  position:fixed;
  inset:0;
  background:#0007;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:18px;
  z-index:999;
}

.modal .card{
  width:min(760px,100%);
  max-height:92vh;
  overflow:auto;
}

@media(max-width:700px){
  .wrap{padding:22px 14px}
  .title{font-size:38px}
  .row{grid-template-columns:1fr}
  table{font-size:13px}
}
</style>
</head>

<body>

<div class="wrap">

  <div class="brand">BILI’S NATURAL COSMETICS</div>
  <div class="title">Administracija</div>

  <section id="login" class="card login">

    <h2>Prijava</h2>

    <p class="muted">
      Samo vlasnik može menjati proizvode, cene i zalihe.
    </p>

    <label>EMAIL</label>

    <input
      id="email"
      type="email"
      autocomplete="username"
      value="duricbiljana.diki@gmail.com"
    >

    <label>LOZINKA</label>

    <input
      id="password"
      type="password"
      autocomplete="current-password"
    >

    <div class="actions">

      <button id="loginBtn">
        Prijavi me
      </button>

      <button
        id="forgotBtn"
        class="linkbtn"
        type="button"
      >
        Zaboravljena lozinka?
      </button>

    </div>

    <div id="loginMsg" class="status hidden"></div>

  </section>


  <section id="dash" class="dash hidden">

    <div class="top">

      <div>
        <span class="badge">Vlasnički pristup</span>
        <div
          id="userEmail"
          class="muted"
          style="margin-top:8px"
        ></div>
      </div>

      <button
        class="secondary"
        id="logoutBtn"
      >
        Odjavi se
      </button>

    </div>


    <div class="card">

      <div class="top">

        <div>
          <h2>Proizvodi</h2>
          <div class="muted">
            Cena, zaliha i vidljivost proizvoda.
          </div>
        </div>

        <button
          class="gold"
          id="addBtn"
        >
          + Dodaj proizvod
        </button>

      </div>

      <div
        id="dashMsg"
        class="status hidden"
      ></div>

      <div style="overflow:auto">

        <table>

          <thead>
            <tr>
              <th>Proizvod</th>
              <th>Cena</th>
              <th>Zaliha</th>
              <th>Aktivan</th>
              <th>Radnja</th>
            </tr>
          </thead>

          <tbody id="productsBody"></tbody>

        </table>

      </div>

    </div>

  </section>

</div>


<div
  id="modal"
  class="modal hidden"
>

  <div class="card">

    <div class="top">

      <h2 id="modalTitle">
        Novi proizvod
      </h2>

      <button
        class="secondary"
        id="closeBtn"
        type="button"
      >
        Zatvori
      </button>

    </div>

    <input
      id="pid"
      type="hidden"
    >

    <div class="row">

      <div>
        <label>NAZIV — SRPSKI</label>
        <input id="name_sr">
      </div>

      <div>
        <label>NAZIV — NEMAČKI</label>
        <input id="name_de">
      </div>

      <div>
        <label>KATEGORIJA</label>
        <input id="category">
      </div>

      <div>
        <label>VELIČINA</label>
        <input id="size">
      </div>

      <div>
        <label>CENA (CHF)</label>
        <input
          id="price_chf"
          type="number"
          step="0.01"
          min="0"
        >
      </div>

      <div>
        <label>ZALIHA</label>
        <input
          id="stock_qty"
          type="number"
          step="1"
          min="0"
        >
      </div>

      <div>
        <label>REDOSLED</label>
        <input
          id="sort_order"
          type="number"
          step="1"
          value="0"
        >
      </div>

      <div>
        <label>SLIKA — URL</label>
        <input id="image">
      </div>

    </div>

    <label>OPIS — SRPSKI</label>
    <textarea id="description_sr"></textarea>

    <label>OPIS — NEMAČKI</label>
    <textarea id="description_de"></textarea>

    <label class="switch">
      <input
        id="active"
        type="checkbox"
        checked
      >
      Proizvod je aktivan
    </label>

    <label class="switch">
      <input
        id="featured"
        type="checkbox"
      >
      Istaknuti proizvod
    </label>

    <div class="actions">

      <button id="saveBtn">
        Sačuvaj
      </button>

      <button
        class="danger"
        id="deleteBtn"
      >
        Obriši
      </button>

    </div>

  </div>

</div>


<script>

/* ==============================
   BILI'S ADMIN — NOVA VERZIJA
   Bez supabase-js biblioteke
   ============================== */

const SUPABASE_URL =
  "https://enzcsfhtduucaggjamnx.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_04GgoHvEKpmroJtjY-1wKA_HjEu7tC9";

const ADMIN_EMAIL =
  "duricbiljana.diki@gmail.com";

const RESET_PASSWORD_URL =
  "https://konjikonji12.github.io/bilis-natural-cosmetics/reset-password.html";


const $ = id =>
  document.getElementById(id);


let session = null;


/* ---------- PORUKE ---------- */

function showMsg(el,text,ok=false){
  el.textContent = text;
  el.className =
    "status " + (ok ? "ok" : "error");
  el.classList.remove("hidden");
}

function clearMsg(el){
  el.textContent = "";
  el.classList.add("hidden");
}


/* ---------- FETCH ---------- */

async function apiFetch(
  path,
  options={}
){

  const headers = {
    "apikey": SUPABASE_KEY,
    ...(options.headers || {})
  };

  if(session?.access_token){
    headers["Authorization"] =
      "Bearer " + session.access_token;
  }

  try{

    return await fetch(
      SUPABASE_URL + path,
      {
        ...options,
        headers
      }
    );

  }catch(err){

    throw new Error(
      "Mrežna greška pri povezivanju sa Supabase-om: "
      + (err?.message || err)
    );

  }
}


/* ---------- SESSION ---------- */

function saveSession(data){

  session = data;

  sessionStorage.setItem(
    "bilis_admin_session",
    JSON.stringify(data)
  );

}


function loadStoredSession(){

  try{

    const raw =
      sessionStorage.getItem(
        "bilis_admin_session"
      );

    if(!raw)return null;

    return JSON.parse(raw);

  }catch{
    return null;
  }

}


function clearSession(){

  session = null;

  sessionStorage.removeItem(
    "bilis_admin_session"
  );

}


/* ---------- LOGIN ---------- */

async function login(){

  clearMsg(
    $("loginMsg")
  );

  const email =
    $("email").value.trim();

  const password =
    $("password").value;

  if(!email || !password){

    return showMsg(
      $("loginMsg"),
      "Unesi email i lozinku."
    );

  }

  $("loginBtn").disabled = true;
  $("loginBtn").textContent =
    "Prijavljivanje…";

  try{

    const response =
      await apiFetch(
        "/auth/v1/token?grant_type=password",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({
            email,
            password
          })
        }
      );


    const text =
      await response.text();

    let data={};

    try{
      data =
        text
        ? JSON.parse(text)
        : {};
    }catch{
      data = {
        raw:text
      };
    }


    if(!response.ok){

      const reason =
        data.msg ||
        data.message ||
        data.error_description ||
        data.error ||
        data.raw ||
        (
          "HTTP "
          + response.status
        );

      throw new Error(reason);
    }


    const userEmail =
      (
        data.user?.email ||
        email
      ).toLowerCase();


    if(
      userEmail !==
      ADMIN_EMAIL.toLowerCase()
    ){

      clearSession();

      throw new Error(
        "Ovaj nalog nema administratorski pristup."
      );

    }


    saveSession(data);

    $("password").value="";

    await showDashboard();


  }catch(err){

    showMsg(
      $("loginMsg"),
      "Prijava nije uspela:\n"
      + err.message
    );

  }finally{

    $("loginBtn").disabled=false;
    $("loginBtn").textContent=
      "Prijavi me";

  }

}


/* ---------- RESET LOZINKE ---------- */

async function forgotPassword(){

  clearMsg(
    $("loginMsg")
  );

  const email =
    $("email").value.trim();

  if(!email){

    return showMsg(
      $("loginMsg"),
      "Unesi email adresu."
    );

  }

  $("forgotBtn").disabled=true;

  try{

    const response =
      await apiFetch(
        "/auth/v1/recover?redirect_to="
        + encodeURIComponent(
          RESET_PASSWORD_URL
        ),
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({
            email
          })
        }
      );


    const text =
      await response.text();


    if(!response.ok){

      let reason=text;

      try{

        const data =
          JSON.parse(text);

        reason =
          data.msg ||
          data.message ||
          data.error_description ||
          text;

      }catch{}

      throw new Error(
        reason ||
        "Reset nije poslat."
      );

    }


    showMsg(
      $("loginMsg"),
      "Email za promenu lozinke je poslat. Otvori najnoviju poruku i pritisni link za reset lozinke.",
      true
    );


  }catch(err){

    showMsg(
      $("loginMsg"),
      "Reset lozinke nije poslat:\n"
      + err.message
    );

  }finally{

    $("forgotBtn").disabled=false;

  }

}


/* ---------- LOGOUT ---------- */

function logout(){

  clearSession();

  $("dash")
    .classList
    .add("hidden");

  $("login")
    .classList
    .remove("hidden");

  clearMsg(
    $("dashMsg")
  );

}


/* ---------- DASHBOARD ---------- */

async function showDashboard(){

  if(!session?.access_token){
    logout();
    return;
  }

  $("login")
    .classList
    .add("hidden");

  $("dash")
    .classList
    .remove("hidden");

  $("userEmail")
    .textContent =
      session.user?.email ||
      ADMIN_EMAIL;

  await loadProducts();

}


/* ---------- PRODUCTS ---------- */

async function loadProducts(){

  const body =
    $("productsBody");

  clearMsg(
    $("dashMsg")
  );

  body.innerHTML =
    "<tr><td colspan='5'>Učitavanje…</td></tr>";


  try{

    const response =
      await apiFetch(
        "/rest/v1/products"
        + "?select=*"
        + "&order=sort_order.asc",
        {
          method:"GET",

          headers:{
            "Accept":
              "application/json"
          }
        }
      );


    const text =
      await response.text();

    let data=[];


    try{

      data =
        text
        ? JSON.parse(text)
        : [];

    }catch{

      throw new Error(
        "Supabase je vratio neispravan odgovor."
      );

    }


    if(!response.ok){

      throw new Error(
        data.message ||
        data.details ||
        data.hint ||
        (
          "HTTP "
          + response.status
        )
      );

    }


    if(!Array.isArray(data)){
      throw new Error(
        "Neočekivan odgovor baze."
      );
    }


    renderProducts(data);


  }catch(err){

    body.innerHTML="";

    showMsg(
      $("dashMsg"),
      "Ne mogu da učitam proizvode:\n"
      + err.message
    );

  }

}


function renderProducts(data){

  const body =
    $("productsBody");


  if(!data.length){

    body.innerHTML =
      "<tr><td colspan='5'>Nema proizvoda.</td></tr>";

    return;

  }


  body.innerHTML =
    data.map(p=>{

      const name =
        p.name_sr ||
        p.name_de ||
        p.name ||
        "Bez naziva";

      const image =
        p.image || "";

      return `
      <tr>

        <td>

          ${
            image
            ?
            `<img
              class="thumb"
              src="${esc(image)}"
              onerror="this.style.display='none'"
            >`
            :
            ""
          }

          <strong>
            ${esc(name)}
          </strong>

          <div class="muted">
            ${esc(p.size||"")}
          </div>

        </td>

        <td>
          ${
            p.price_chf != null
            ?
            Number(
              p.price_chf
            ).toFixed(2)
            + " CHF"
            :
            "—"
          }
        </td>

        <td
          class="${
            Number(
              p.stock_qty||0
            ) <= 3
            ?
            "stock-low"
            :
            ""
          }"
        >
          ${p.stock_qty ?? 0}
        </td>

        <td>
          ${
            p.active
            ?
            "Da"
            :
            "Ne"
          }
        </td>

        <td>

          <button
            class="secondary"
            data-edit-id="${esc(p.id)}"
          >
            Uredi
          </button>

        </td>

      </tr>
      `;

    }).join("");


  document
    .querySelectorAll(
      "[data-edit-id]"
    )
    .forEach(btn=>{

      btn.onclick=()=>{

        const id =
          btn.getAttribute(
            "data-edit-id"
          );

        const product =
          data.find(
            p =>
            String(p.id) ===
            String(id)
          );

        if(product){
          openModal(product);
        }

      };

    });

}


/* ---------- MODAL ---------- */

function openModal(p={}){

  $("modalTitle")
    .textContent =
      p.id
      ?
      "Uredi proizvod"
      :
      "Novi proizvod";


  $("pid").value =
    p.id || "";


  [
    "name_sr",
    "name_de",
    "category",
    "size",
    "price_chf",
    "stock_qty",
    "sort_order",
    "image",
    "description_sr",
    "description_de"
  ]
  .forEach(k=>{

    $(k).value =
      p[k] ??
      (
        k === "sort_order"
        ?
        0
        :
        ""
      );

  });


  $("active").checked =
    p.id
    ?
    p.active !== false
    :
    true;


  $("featured").checked =
    !!p.featured;


  $("deleteBtn")
    .style
    .display =
      p.id
      ?
      "inline-block"
      :
      "none";


  $("modal")
    .classList
    .remove("hidden");

}


function closeModal(){

  $("modal")
    .classList
    .add("hidden");

}


/* ---------- SAVE PRODUCT ---------- */

async function saveProduct(){

  clearMsg(
    $("dashMsg")
  );

  $("saveBtn").disabled=true;


  const payload={};


  [
    "name_sr",
    "name_de",
    "category",
    "size",
    "image",
    "description_sr",
    "description_de"
  ]
  .forEach(k=>{

    payload[k] =
      $(k).value.trim();

  });


  payload.price_chf =
    Number(
      $("price_chf").value || 0
    );


  payload.stock_qty =
    Number(
      $("stock_qty").value || 0
    );


  payload.sort_order =
    Number(
      $("sort_order").value || 0
    );


  payload.active =
    $("active").checked;


  payload.featured =
    $("featured").checked;


  const id =
    $("pid").value;


  try{

    const path =
      id
      ?
      "/rest/v1/products?id=eq."
      + encodeURIComponent(id)
      :
      "/rest/v1/products";


    const response =
      await apiFetch(
        path,
        {
          method:
            id
            ?
            "PATCH"
            :
            "POST",

          headers:{
            "Content-Type":
              "application/json",

            "Prefer":
              "return=representation"
          },

          body:
            JSON.stringify(payload)
        }
      );


    const text =
      await response.text();


    if(!response.ok){

      let reason=text;

      try{

        const data =
          JSON.parse(text);

        reason =
          data.message ||
          data.details ||
          data.hint ||
          text;

      }catch{}


      throw new Error(
        reason ||
        (
          "HTTP "
          + response.status
        )
      );

    }


    closeModal();


    showMsg(
      $("dashMsg"),
      "Proizvod je uspešno sačuvan.",
      true
    );


    await loadProducts();


  }catch(err){

    showMsg(
      $("dashMsg"),
      "Nije sačuvano:\n"
      + err.message
    );

  }finally{

    $("saveBtn").disabled=false;

  }

}


/* ---------- DELETE PRODUCT ---------- */

async function deleteProduct(){

  const id =
    $("pid").value;


  if(!id)return;


  if(
    !confirm(
      "Da li sigurno želiš da obrišeš ovaj proizvod?"
    )
  ){
    return;
  }


  $("deleteBtn").disabled=true;


  try{

    const response =
      await apiFetch(
        "/rest/v1/products?id=eq."
        + encodeURIComponent(id),
        {
          method:"DELETE"
        }
      );


    const text =
      await response.text();


    if(!response.ok){

      let reason=text;

      try{

        const data =
          JSON.parse(text);

        reason =
          data.message ||
          data.details ||
          data.hint ||
          text;

      }catch{}


      throw new Error(
        reason ||
        (
          "HTTP "
          + response.status
        )
      );

    }


    closeModal();


    showMsg(
      $("dashMsg"),
      "Proizvod je obrisan.",
      true
    );


    await loadProducts();


  }catch(err){

    showMsg(
      $("dashMsg"),
      "Nije obrisano:\n"
      + err.message
    );

  }finally{

    $("deleteBtn").disabled=false;

  }

}


/* ---------- ESCAPE ---------- */

function esc(v){

  return String(v ?? "")
    .replace(
      /[&<>"']/g,
      c=>({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        "\"":"&quot;",
        "'":"&#039;"
      }[c])
    );

}


/* ---------- EVENTS ---------- */

$("loginBtn").onclick =
  login;

$("forgotBtn").onclick =
  forgotPassword;

$("logoutBtn").onclick =
  logout;

$("addBtn").onclick =
  ()=>openModal();

$("closeBtn").onclick =
  closeModal;

$("saveBtn").onclick =
  saveProduct;

$("deleteBtn").onclick =
  deleteProduct;


$("password")
  .addEventListener(
    "keydown",
