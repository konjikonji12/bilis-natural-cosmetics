<!doctype html>
<html lang="sr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Bili’s Natural Cosmetics — Administracija</title>
  <meta name="robots" content="noindex,nofollow">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root{
      --bg:#f6f4ef;
      --card:#ffffff;
      --ink:#171717;
      --muted:#777;
      --line:#ddd8cf;
      --gold:#b68b35;
      --ok:#23612a;
      --bad:#9c2f27;
      --bad-bg:#f8e5e2;
      --ok-bg:#e9f4e9;
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      background:var(--bg);
      color:var(--ink);
      font-family:Arial,sans-serif;
    }

    button,input,textarea,select{
      font:inherit;
    }

    button{cursor:pointer}

    [hidden]{
      display:none !important;
    }

    .wrap{
      width:min(1180px,calc(100% - 28px));
      margin:auto;
      padding:35px 0 70px;
    }

    .brand{
      letter-spacing:.18em;
      text-transform:uppercase;
      font-size:14px;
      margin-bottom:10px;
    }

    h1,h2,h3{
      font-family:Georgia,serif;
    }

    h1{
      font-size:60px;
      margin:0 0 30px;
    }

    h2{
      font-size:38px;
      margin:0 0 10px;
    }

    .card{
      background:white;
      border:1px solid var(--line);
      border-radius:26px;
    }

    .login-card{
      max-width:780px;
      padding:42px;
    }

    .lead{
      color:var(--muted);
      font-size:19px;
      margin-bottom:28px;
    }

    .field{
      display:grid;
      gap:7px;
      margin-bottom:18px;
    }

    .field label{
      font-size:13px;
      letter-spacing:.12em;
      text-transform:uppercase;
      font-weight:bold;
    }

    input,textarea,select{
      width:100%;
      border:1px solid #cfc7bb;
      background:white;
      border-radius:16px;
      padding:14px 16px;
    }

    textarea{
      min-height:110px;
    }

    .row{
      display:flex;
      gap:12px;
      align-items:center;
      flex-wrap:wrap;
    }

    .btn{
      border:0;
      border-radius:15px;
      padding:13px 19px;
      font-weight:bold;
      background:#8d8d8d;
      color:white;
    }

    .btn-gold{
      background:var(--gold);
      color:#111;
    }

    .btn-dark{
      background:#191919;
    }

    .btn-light{
      background:#f0ede7;
      color:#222;
      border:1px solid var(--line);
    }

    .btn-danger{
      background:#9c2f27;
    }

    .link-btn{
      background:none;
      border:0;
      color:#6f6f6f;
      text-decoration:underline;
      font-weight:bold;
    }

    .msg{
      margin-top:20px;
      border-radius:16px;
      padding:14px 16px;
    }

    .msg.error{
      background:var(--bad-bg);
      color:var(--bad);
    }

    .msg.ok{
      background:var(--ok-bg);
      color:var(--ok);
    }

    .msg.info{
      background:#efede8;
      color:#4c4944;
    }

    .topbar{
      display:flex;
      justify-content:space-between;
      align-items:flex-end;
      gap:18px;
      margin-bottom:20px;
    }

    .tools{
      padding:18px;
      margin-bottom:18px;
      display:grid;
      grid-template-columns:1.5fr .8fr .8fr auto;
      gap:12px;
    }

    .stats{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:12px;
      margin-bottom:18px;
    }

    .stat{
      padding:20px;
      background:white;
      border:1px solid var(--line);
      border-radius:20px;
    }

    .stat b{
      font-size:30px;
      font-family:Georgia,serif;
    }

    .stat span{
      display:block;
      color:var(--muted);
      font-size:13px;
    }

    .table-card{
      overflow:hidden;
    }

    .table-wrap{
      overflow:auto;
    }

    table{
      width:100%;
      border-collapse:collapse;
      min-width:900px;
    }

    th,td{
      padding:14px;
      border-bottom:1px solid #eee9e0;
      text-align:left;
    }

    th{
      background:#faf8f4;
      font-size:12px;
      text-transform:uppercase;
    }

    .product-cell{
      display:flex;
      gap:12px;
      align-items:center;
    }

    .thumb{
      width:52px;
      height:52px;
      object-fit:cover;
      border-radius:12px;
      border:1px solid var(--line);
      background:#f1eee8;
    }

    .product-name{
      font-weight:bold;
    }

    .product-sub{
      color:var(--muted);
      font-size:12px;
    }

    .pill{
      display:inline-block;
      border-radius:999px;
      padding:6px 9px;
      font-size:12px;
      font-weight:bold;
    }

    .pill.on{
      background:#e8f3e8;
      color:#24602a;
    }

    .pill.off{
      background:#f1eeee;
      color:#766d6d;
    }

    .pill.featured{
      background:#f6edcf;
      color:#6d5318;
    }

    .actions{
      display:flex;
      gap:7px;
    }

    .actions .btn{
      padding:8px 11px;
      font-size:13px;
    }

    .empty{
      padding:40px;
      text-align:center;
      color:var(--muted);
    }

    dialog{
      width:min(760px,calc(100% - 20px));
      border:0;
      border-radius:24px;
      padding:0;
    }

    dialog::backdrop{
      background:rgba(20,18,15,.48);
    }

    .modal{
      padding:28px;
      max-height:88vh;
      overflow:auto;
    }

    .modal-head{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:22px;
    }

    .close{
      border:0;
      background:#eeeae3;
      width:42px;
      height:42px;
      border-radius:50%;
      font-size:22px;
    }

    .grid2{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:15px;
    }

    .checks{
      display:flex;
      gap:20px;
      margin:8px 0 18px;
    }

    .check{
      display:flex;
      gap:8px;
      align-items:center;
      font-weight:bold;
    }

    .check input{
      width:auto;
    }

    @media(max-width:700px){
      h1{
        font-size:48px;
      }

      .login-card{
        padding:28px 20px;
      }

      .topbar{
        flex-direction:column;
        align-items:flex-start;
      }

      .tools{
        grid-template-columns:1fr;
      }

      .stats{
        grid-template-columns:1fr 1fr;
      }

      .grid2{
        grid-template-columns:1fr;
      }
    }
  </style>
</head>

<body>

<main class="wrap">

  <div class="brand">Bili’s Natural Cosmetics</div>

  <h1>Administracija</h1>

  <section id="loginSection" class="card login-card">

    <h2>Prijava</h2>

    <p class="lead">
      Samo vlasnik može menjati proizvode, cene i zalihe.
    </p>

    <form id="loginForm">

      <div class="field">
        <label>Email</label>

        <input
          id="email"
          type="email"
          value="duricbiljana.diki@gmail.com"
          autocomplete="username"
          required
        >
      </div>

      <div class="field">
        <label>Lozinka</label>

        <input
          id="password"
          type="password"
          autocomplete="current-password"
          required
        >
      </div>

      <div class="row">

        <button
          id="loginBtn"
          class="btn"
          type="submit"
        >
          Prijavi me
        </button>

        <button
          id="forgotBtn"
          class="link-btn"
          type="button"
        >
          Zaboravljena lozinka?
        </button>

      </div>

    </form>

    <div
      id="loginMsg"
      class="msg info"
      hidden
    ></div>

  </section>


  <section id="adminSection" hidden>

    <div class="topbar">

      <div>

        <h2>Proizvodi</h2>

        <div id="sessionEmail"></div>

      </div>

      <div class="row">

        <button
          id="addBtn"
          class="btn btn-gold"
          type="button"
        >
          + Novi proizvod
        </button>

        <button
          id="refreshBtn"
          class="btn btn-light"
          type="button"
        >
          Osveži
        </button>

        <button
          id="logoutBtn"
          class="btn btn-dark"
          type="button"
        >
          Odjava
        </button>

      </div>

    </div>

    <div
      id="adminMsg"
      class="msg info"
      hidden
    ></div>


    <section class="stats">

      <div class="stat">
        <b id="statAll">0</b>
        <span>Ukupno proizvoda</span>
      </div>

      <div class="stat">
        <b id="statActive">0</b>
        <span>Aktivni</span>
      </div>

      <div class="stat">
        <b id="statStock">0</b>
        <span>Ukupno na stanju</span>
      </div>

      <div class="stat">
        <b id="statFeatured">0</b>
        <span>Istaknuti</span>
      </div>

    </section>


    <section class="card tools">

      <input
        id="searchInput"
        type="search"
        placeholder="Pretraži proizvode..."
      >

      <select id="categoryFilter">
        <option value="">
          Sve kategorije
        </option>
      </select>

      <select id="activeFilter">

        <option value="">
          Svi statusi
        </option>

        <option value="true">
          Samo aktivni
        </option>

        <option value="false">
          Samo neaktivni
        </option>

      </select>

      <button
        id="clearFiltersBtn"
        class="btn btn-light"
        type="button"
      >
        Obriši filtere
      </button>

    </section>


    <section class="card table-card">

      <div class="table-wrap">

        <table>

          <thead>

            <tr>
              <th>Proizvod</th>
              <th>Kategorija</th>
              <th>Veličina</th>
              <th>Cena CHF</th>
              <th>Zaliha</th>
              <th>Status</th>
              <th>Redosled</th>
              <th>Akcije</th>
            </tr>

          </thead>

          <tbody id="productsBody"></tbody>

        </table>

      </div>

      <div
        id="emptyState"
        class="empty"
        hidden
      >
        Nema proizvoda za prikaz.
      </div>

    </section>

  </section>

</main>


<dialog id="productDialog">

<form
  id="productForm"
  class="modal"
  method="dialog"
>

  <div class="modal-head">

    <h3 id="modalTitle">
      Proizvod
    </h3>

    <button
      id="closeDialogBtn"
      class="close"
      type="button"
    >
      ×
    </button>

  </div>


  <input
    id="p_id"
    type="hidden"
  >


  <div class="grid2">

    <div class="field">

      <label>
        Naziv — srpski
      </label>

      <input
        id="p_name_sr"
        required
      >

    </div>


    <div class="field">

      <label>
        Naziv — nemački
      </label>

      <input id="p_name_de">

    </div>

  </div>


  <div class="grid2">

    <div class="field">

      <label>Slug</label>

      <input
        id="p_slug"
        required
      >

    </div>


    <div class="field">

      <label>Kategorija</label>

      <input
        id="p_category"
        value="Ostalo"
        required
      >

    </div>

  </div>


  <div class="grid2">

    <div class="field">

      <label>Veličina</label>

      <input id="p_size">

    </div>


    <div class="field">

      <label>Cena CHF</label>

      <input
        id="p_price_chf"
        type="number"
        step="0.01"
        min="0"
      >

    </div>

  </div>


  <div class="grid2">

    <div class="field">

      <label>Zaliha</label>

      <input
        id="p_stock_qty"
        type="number"
        min="0"
      >

    </div>


    <div class="field">

      <label>Redosled</label>

      <input
        id="p_sort_order"
        type="number"
      >

    </div>

  </div>


  <div class="field">

    <label>URL slike</label>

    <input
      id="p_image_url"
      type="url"
    >

  </div>


  <div class="field">

    <label>
      Opis — srpski
    </label>

    <textarea
      id="p_description_sr"
    ></textarea>

  </div>


  <div class="field">

    <label>
      Opis — nemački
    </label>

    <textarea
      id="p_description_de"
    ></textarea>

  </div>


  <div class="checks">

    <label class="check">

      <input
        id="p_active"
        type="checkbox"
        checked
      >

      Aktivan

    </label>


    <label class="check">

      <input
        id="p_featured"
        type="checkbox"
      >

      Istaknut

    </label>

  </div>


  <div class="row">

    <button
      id="saveBtn"
      class="btn btn-gold"
      type="submit"
    >
      Sačuvaj
    </button>

    <button
      id="cancelBtn"
      class="btn btn-light"
      type="button"
    >
      Otkaži
    </button>

    <button
      id="deleteBtn"
      class="btn btn-danger"
      type="button"
      hidden
    >
      Obriši proizvod
    </button>

  </div>


  <div
    id="modalMsg"
    class="msg info"
    hidden
  ></div>

</form>

</dialog>


<script>

const SUPABASE_URL =
"https://enzcsfhtduucagqjamnx.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_04GgoHvEKpmroJtjY-1wKA_HjEu7tC9";


const { createClient } = supabase;

const db = createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY,
  {
    auth:{
      persistSession:true,
      autoRefreshToken:true,
      detectSessionInUrl:true
    }
  }
);


const $ = id =>
document.getElementById(id);


let products = [];


function setMsg(
  el,
  text="",
  type="info"
){

  if(!text){

    el.hidden = true;

    el.textContent = "";

    return;

  }

  el.hidden = false;

  el.textContent = text;

  el.className =
  "msg " + type;

}


function escapeHtml(value){

  return String(value ?? "")

  .replaceAll("&","&amp;")

  .replaceAll("<","&lt;")

  .replaceAll(">","&gt;")

  .replaceAll('"',"&quot;")

  .replaceAll("'","&#039;");

}


function money(v){

  const n =
  Number(v ?? 0);

  return Number.isFinite(n)
  ? n.toFixed(2)
  : "0.00";

}


async function showAdmin(user){

  $("loginSection").hidden =
  true;

  $("adminSection").hidden =
  false;

  $("sessionEmail").textContent =
  "Prijavljeni: " +
  (user?.email || "");

  await loadProducts();

}


function showLogin(){

  $("adminSection").hidden =
  true;

  $("loginSection").hidden =
  false;

}


async function loadProducts(){

  setMsg(
    $("adminMsg"),
    "Učitavam proizvode…",
    "info"
  );


  const {data,error} =
  await db

  .from("products")

  .select("*")

  .order(
    "sort_order",
    {ascending:true}
  )

  .order(
    "name_sr",
    {ascending:true}
  );


  if(error){

    console.error(error);

    setMsg(
      $("adminMsg"),
      "Greška pri učitavanju proizvoda: "
      + error.message,
      "error"
    );

    return;

  }


  products =
  data || [];


  setMsg(
    $("adminMsg"),
    ""
  );


  buildCategoryFilter();

  renderProducts();

  updateStats();

}


function buildCategoryFilter(){

  const select =
  $("categoryFilter");


  const categories =
  [...new Set(

    products

    .map(p => p.category)

    .filter(Boolean)

  )];


  select.innerHTML =
  '<option value="">Sve kategorije</option>' +

  categories

  .map(c =>
  `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`
  )

  .join("");

}


function filteredProducts(){

  const q =
  $("searchInput")
  .value
  .trim()
  .toLowerCase();


  const category =
  $("categoryFilter").value;


  const active =
  $("activeFilter").value;


  return products.filter(p=>{

    const text = [

      p.name_sr,
      p.name_de,
      p.slug,
      p.category,
      p.size

    ]

    .join(" ")

    .toLowerCase();


    if(
      q &&
      !text.includes(q)
    ){
      return false;
    }


    if(
      category &&
      p.category !== category
    ){
      return false;
    }


    if(
      active === "true" &&
      p.active !== true
    ){
      return false;
    }


    if(
      active === "false" &&
      p.active !== false
    ){
      return false;
    }


    return true;

  });

}


function renderProducts(){

  const list =
  filteredProducts();


  $("productsBody").innerHTML =
  "";


  $("emptyState").hidden =
  list.length !== 0;


  list.forEach(p=>{

    const tr =
    document.createElement("tr");


    const image =
    p.image_url

    ? `<img class="thumb"
         src="${escapeHtml(p.image_url)}"
         alt="">`

    : `<div class="thumb"></div>`;


    tr.innerHTML = `

    <td>

      <div class="product-cell">

        ${image}

        <div>

          <div class="product-name">

            ${escapeHtml(
              p.name_sr ||
              p.name_de ||
              "Bez naziva"
            )}

          </div>

          <div class="product-sub">

            ${escapeHtml(
              p.slug || ""
            )}

          </div>

        </div>

      </div>

    </td>


    <td>
      ${escapeHtml(
        p.category || ""
      )}
    </td>


    <td>
      ${escapeHtml(
        p.size || ""
      )}
    </td>


    <td>
      ${money(
        p.price_chf
      )}
    </td>


    <td>
      ${Number(
        p.stock_qty || 0
      )}
    </td>


    <td>

      <span class="pill ${
        p.active
        ? "on"
        : "off"
      }">

        ${
          p.active
          ? "Aktivan"
          : "Neaktivan"
        }

      </span>

      ${
        p.featured
        ? '<span class="pill featured">Istaknut</span>'
        : ""
      }

    </td>


    <td>
      ${Number(
        p.sort_order || 0
      )}
    </td>


    <td>

      <div class="actions">

        <button
          class="btn btn-light edit-btn"
          data-id="${p.id}"
          type="button"
        >
          Izmeni
        </button>


        <button
          class="btn btn-dark toggle-btn"
          data-id="${p.id}"
          type="button"
        >

          ${
            p.active
            ? "Sakrij"
            : "Aktiviraj"
          }

        </button>

      </div>

    </td>

    `;


    $("productsBody")
    .appendChild(tr);

  });


  document

  .querySelectorAll(
    ".edit-btn"
  )

  .forEach(btn=>{

    btn.addEventListener(
      "click",
      ()=>openEdit(
        btn.dataset.id
      )
    );

  });


  document

  .querySelectorAll(
    ".toggle-btn"
  )

  .forEach(btn=>{

    btn.addEventListener(
      "click",
      ()=>toggleActive(
        btn.dataset.id
      )
    );

  });

}


function updateStats(){

  $("statAll").textContent =
  products.length;


  $("statActive").textContent =
  products.filter(
    p=>p.active
  ).length;


  $("statStock").textContent =
  products.reduce(
    (sum,p)=>
    sum +
    Number(
      p.stock_qty || 0
    ),
    0
  );


  $("statFeatured").textContent =
  products.filter(
    p=>p.featured
  ).length;

}


function resetForm(){

  $("productForm").reset();

  $("p_id").value = "";

  $("p_category").value =
  "Ostalo";

  $("p_stock_qty").value =
  0;

  $("p_sort_order").value =
  0;

  $("p_active").checked =
  true;

  $("deleteBtn").hidden =
  true;

  setMsg(
    $("modalMsg"),
    ""
  );

}


function openNew(){

  resetForm();

  $("modalTitle").textContent =
  "Novi proizvod";

  $("productDialog")
  .showModal();

}


function openEdit(id){

  const p =
  products.find(
    x=>x.id === id
  );


  if(!p) return;


  resetForm();


  $("modalTitle").textContent =
  "Izmeni proizvod";


  $("p_id").value =
  p.id || "";


  $("p_name_sr").value =
  p.name_sr || "";


  $("p_name_de").value =
  p.name_de || "";


  $("p_slug").value =
  p.slug || "";


  $("p_category").value =
  p.category || "Ostalo";


  $("p_size").value =
  p.size || "";


  $("p_price_chf").value =
  p.price_chf ?? 0;


  $("p_stock_qty").value =
  p.stock_qty ?? 0;


  $("p_sort_order").value =
  p.sort_order ?? 0;


  $("p_image_url").value =
  p.image_url || "";


  $("p_description_sr").value =
  p.description_sr || "";


  $("p_description_de").value =
  p.description_de || "";


  $("p_active").checked =
  p.active !== false;


  $("p_featured").checked =
  p.featured === true;


  $("deleteBtn").hidden =
  false;


  $("productDialog")
  .showModal();

}


function payload(){

  return {

    slug:
    $("p_slug").value.trim(),

    name_sr:
    $("p_name_sr").value.trim(),

    name_de:
    $("p_name_de").value.trim()
    || null,

    description_sr:
    $("p_description_sr")
    .value.trim()
    || null,

    description_de:
    $("p_description_de")
    .value.trim()
    || null,

    category:
    $("p_category").value.trim()
    || "Ostalo",

    size:
    $("p_size").value.trim()
    || null,

    price_chf:
    Number(
      $("p_price_chf").value
      || 0
    ),

    stock_qty:
    Math.max(
      0,
      parseInt(
        $("p_stock_qty").value
        || 0
      )
    ),

    image_url:
    $("p_image_url").value.trim()
    || null,

    active:
    $("p_active").checked,

    featured:
    $("p_featured").checked,

    sort_order:
    parseInt(
      $("p_sort_order").value
      || 0
    ),

    updated_at:
    new Date().toISOString()

  };

}


$("productForm")
.addEventListener(
"submit",
async e=>{

  e.preventDefault();


  const id =
  $("p_id").value;


  const data =
  payload();


  setMsg(
    $("modalMsg"),
    "Čuvam…",
    "info"
  );


  let result;


  if(id){

    result =
    await db

    .from("products")

    .update(data)

    .eq("id",id);

  }else{

    result =
    await db

    .from("products")

    .insert(data);

  }


  if(result.error){

    setMsg(
      $("modalMsg"),
      "Greška: "
      + result.error.message,
      "error"
    );

    return;

  }


  setMsg(
    $("modalMsg"),
    "Sačuvano.",
    "ok"
  );


  await loadProducts();


  setTimeout(
    ()=>{
      $("productDialog")
      .close();
    },
    300
  );

});


async function toggleActive(id){

  const p =
  products.find(
    x=>x.id === id
  );


  if(!p) return;


  const {error} =
  await db

  .from("products")

  .update({

    active:
    !p.active,

    updated_at:
    new Date().toISOString()

  })

  .eq(
    "id",
    id
  );


  if(error){

    setMsg(
      $("adminMsg"),
      "Promena nije sačuvana: "
      + error.message,
      "error"
    );

    return;

  }


  await loadProducts();

}


async function deleteProduct(){

  const id =
  $("p_id").value;


  if(!id) return;


  if(
    !confirm(
      "Da li sigurno želiš da obrišeš ovaj proizvod?"
    )
  ){
    return;
  }


  const {error} =
  await db

  .from("products")

  .delete()

  .eq(
    "id",
    id
  );


  if(error){

    setMsg(
      $("modalMsg"),
      "Brisanje nije uspelo: "
      + error.message,
      "error"
    );

    return;

  }


  $("productDialog")
  .close();


  await loadProducts();

}


$("loginForm")
.addEventListener(
"submit",
async e=>{

  e.preventDefault();


  const email =
  $("email")
  .value
  .trim();


  const password =
  $("password")
  .value;


  setMsg(
    $("loginMsg"),
    "Prijavljujem…",
    "info"
  );


  $("loginBtn").disabled =
  true;


  const {data,error} =
  await db.auth

  .signInWithPassword({

    email,
    password

  });


  $("loginBtn").disabled =
  false;


  if(error){

    setMsg(
      $("loginMsg"),
      "Prijava nije uspela: "
      + error.message,
      "error"
    );

    return;

  }


  setMsg(
    $("loginMsg"),
    ""
  );


  $("password").value =
  "";


  await showAdmin(
    data.user
  );

});


$("forgotBtn")
.addEventListener(
"click",
async ()=>{

  const email =
  $("email")
  .value
  .trim();


  if(!email){

    setMsg(
      $("loginMsg"),
      "Prvo upiši email adresu.",
      "error"
    );

    return;

  }


  setMsg(
    $("loginMsg"),
    "Šaljem link za promenu lozinke…",
    "info"
  );


  const redirectTo =
  location.origin
  + location.pathname;


  const {error} =
  await db.auth

  .resetPasswordForEmail(
    email,
    {redirectTo}
  );


  if(error){

    setMsg(
      $("loginMsg"),
      "Slanje nije uspelo: "
      + error.message,
      "error"
    );

  }else{

    setMsg(
      $("loginMsg"),
      "Poslat je email sa linkom za promenu lozinke.",
      "ok"
    );

  }

});


$("logoutBtn")
.addEventListener(
"click",
async ()=>{

  await db.auth.signOut();

  showLogin();

});

loadProducts

);

db.auth
.onAuthStateChange(
async (event,session)=>{

  if(
    event === "SIGNED_OUT"
  ){

    showLogin();

  }


  if(
    event === "SIGNED_IN"
    &&
    session?.user
  ){

    await showAdmin(
      session.user
    );

  }

});


(async function(){

  const {data,error} =
  await db.auth
  .getSession();


  if(error){

    setMsg(
      $("loginMsg"),
      "Greška pri povezivanju: "
      + error.message,
      "error"
    );

    return;

  }


  if(
    data?.session?.user
  ){

    await showAdmin(
      data.session.user
    );

  }else{

    showLogin();

  }

})();

</script>
