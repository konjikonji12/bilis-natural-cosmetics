<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Bili's Natural Cosmetics</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --b:#10100f;
  --c:#f7f3eb;
  --p:#fffdf9;
  --g:#b99a5a;
  --l:#ddd5c7;
  --t:#24231f
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--c);
  color:var(--t);
  font:15px Arial,sans-serif;
  line-height:1.55
}

a{
  text-decoration:none;
  color:inherit
}

nav{
  position:sticky;
  top:0;
  z-index:10;
  background:var(--b);
  color:white;
  padding:16px 5%;
  display:flex;
  justify-content:space-between;
  align-items:center
}

.brand{
  font:32px Georgia,serif
}

.brand small{
  display:block;
  color:var(--g);
  font:9px Arial;
  letter-spacing:3px
}

.tools{
  display:flex;
  gap:7px
}

button,.btn{
  border:1px solid var(--b);
  padding:11px 14px;
  background:var(--b);
  color:white;
  cursor:pointer
}

.tools button{
  border-color:#6d6045
}

.tools .on{
  background:var(--g);
  color:#111
}

.hero,.section,.contact{
  padding:70px 5%;
  max-width:1200px;
  margin:auto
}

.hero{
  max-width:none;
  min-height:55vh;
  background:linear-gradient(135deg,#f7f3eb,#eee7da)
}

h1,h2,h3{
  font-family:Georgia,serif;
  font-weight:400
}

h1{
  font-size:clamp(46px,7vw,82px);
  max-width:780px
}

.gold{
  color:var(--g);
  letter-spacing:3px;
  font-size:11px;
  font-weight:bold
}

.filters{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin:25px 0
}

.filters button{
  background:transparent;
  color:#222;
  border-color:var(--l)
}

.filters .on{
  background:var(--b);
  color:white
}

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px
}

.card{
  background:var(--p);
  border:1px solid var(--l)
}

.photo{
  aspect-ratio:1;
  overflow:hidden;
  background:#eee
}

.photo img{
  width:100%;
  height:100%;
  object-fit:cover
}

.info{
  padding:18px
}

.price{
  font-weight:bold;
  font-size:18px
}

.stock{
  font-size:12px;
  color:#777
}

.row{
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:end;
  border-top:1px solid var(--l);
  padding-top:15px;
  margin-top:15px
}

.story{
  background:var(--b);
  color:white;
  padding:70px 5%
}

.story>div{
  max-width:1200px;
  margin:auto
}

.contact{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:30px
}

.legal{
  padding:25px 5%;
  font-size:12px;
  color:#666
}

footer{
  background:var(--b);
  color:#aaa;
  text-align:center;
  padding:25px
}

.overlay{
  display:none;
  position:fixed;
  inset:0;
  background:#0009;
  z-index:30
}

.overlay.open{
  display:block
}

.drawer{
  position:absolute;
  right:0;
  top:0;
  height:100%;
  width:min(440px,100%);
  background:var(--p);
  padding:22px;
  overflow:auto
}

.cartitem{
  padding:12px 0;
  border-bottom:1px solid var(--l)
}

input,textarea,select{
  width:100%;
  padding:11px;
  margin:5px 0 10px;
  border:1px solid var(--l)
}

.full{
  width:100%
}

@media(max-width:800px){
  .grid{
    grid-template-columns:repeat(2,1fr)
  }
}

@media(max-width:540px){
  .grid{
    grid-template-columns:1fr
  }

  .hero,.section,.contact{
    padding-left:18px;
    padding-right:18px
  }

  .contact{
    grid-template-columns:1fr
  }
}
</style>
</head>

<body>

<nav>

<div class="brand">
Bili's
<small>NATURAL COSMETICS</small>
</div>

<div class="tools">

<button
id="sr"
class="on"
onclick="setLang('sr')">
SR
</button>

<button
id="de"
onclick="setLang('de')">
DE
</button>

<button onclick="cartOpen()">
🛒 <span id="cc">0</span>
</button>

</div>

</nav>


<section class="hero">

<div class="gold">
HANDMADE • NATURAL • SWITZERLAND
</div>

<h1 id="hero"></h1>

<p id="heroText"></p>

<a
class="btn"
href="#products"
id="see">
</a>

</section>


<section
class="section"
id="products">

<div class="gold">
BILI'S COLLECTION
</div>

<h2 id="prodTitle"></h2>

<p id="prodSub"></p>

<div
id="filters"
class="filters">
</div>

<div
id="grid"
class="grid">
Učitavanje...
</div>

</section>


<section class="story">

<div>

<div class="gold">
BILI'S NATURAL COSMETICS
</div>

<h2 id="storyTitle"></h2>

<p id="storyText"></p>

</div>

</section>


<section class="contact">

<div>

<div
class="gold"
id="contactLabel">
</div>

<h2 id="here"></h2>

</div>


<div>

<b>
Bili's Natural Cosmetics
</b>

<p>
Duric Biljana<br>
Abt Bedastrasse 42<br>
9245 Sonnental<br>
Schweiz
</p>

<p>
Telefon: 077 438 39 16<br>
E-Mail: duricbiljana.diki@gmail.com
</p>

</div>

</section>


<div class="legal">

<b id="warning"></b>

<span id="legal"></span>

</div>


<footer>
© <span id="year"></span>
Bili's Natural Cosmetics
</footer>


<div
id="ov"
class="overlay"
onclick="if(event.target===this)cartClose()">

<div class="drawer">

<button onclick="cartClose()">
×
</button>

<h2 id="cartTitle"></h2>

<div id="items"></div>

<h3>
<span id="totalLabel"></span>:
<span id="total">0.00</span> CHF
</h3>

<hr>


<label id="nameL"></label>
<input id="name">


<label id="addressL"></label>
<input id="address">


<label>
E-Mail
</label>
<input id="email">


<label id="phoneL"></label>
<input id="phone">


<label id="payL"></label>

<select id="pay">

<option>
TWINT
</option>

<option>
PayPal
</option>

<option value="Bar">
Bar / Gotovina
</option>

</select>


<label id="noteL"></label>

<textarea id="note"></textarea>


<button
class="full"
id="send"
onclick="sendOrder()">
</button>


<p
id="ship"
style="font-size:12px;color:#777">
</p>

</div>

</div>


<script>

const db =
supabase.createClient(
"https://enzcsfhtduucagqjamnx.supabase.co",
"sb_publishable_04GgoHvEKpmroJtjY-1wKA_HjEu7tC9"
);


const T = {

sr:{

hero:
"Prirodna nega sa posebnom pričom.",

heroText:
"Pažljivo birana ulja, biljni macerati i prirodni sastojci, objedinjeni u kolekciji ručno izrađene kozmetike.",

see:
"Pogledaj kolekciju",

prodTitle:
"Proizvodi",

prodSub:
"Cena i stanje zaliha učitavaju se direktno iz online baze.",

storyTitle:
"Prirodno. Pažljivo. Ručno.",

storyText:
"Bili's Natural Cosmetics je kolekcija prirodne kozmetike razvijena sa posebnom pažnjom prema izboru sirovina i kvalitetu izrade.",

contactLabel:
"KONTAKT",

here:
"Tu smo za vas.",

warning:
"Važna napomena:",

legal:
"Kozmetički proizvodi nisu lekovi. Moguća je individualna alergijska reakcija. Pre prve upotrebe preporučuje se test na malom delu kože. Kupovina i korišćenje su na sopstvenu odgovornost.",

cartTitle:
"Korpa",

totalLabel:
"Ukupno",

nameL:
"Ime i prezime",

addressL:
"Adresa",

phoneL:
"Telefon",

payL:
"Način plaćanja",

noteL:
"Napomena",

send:
"Pošalji porudžbinu preko WhatsApp-a",

ship:
"Dostava se dodatno naplaćuje. Dostava je moguća u Švajcarskoj, EU i drugim zemljama; transport plaća kupac.",

all:
"Sve",

add:
"Dodaj u korpu",

available:
"Dostupno",

none:
"Trenutno nije dostupno",

empty:
"Korpa je prazna."

},


de:{

hero:
"Natürliche Pflege mit einer besonderen Geschichte.",

heroText:
"Sorgfältig ausgewählte Öle, Pflanzenmazerate und natürliche Inhaltsstoffe in einer Kollektion handgefertigter Kosmetik.",

see:
"Kollektion ansehen",

prodTitle:
"Produkte",

prodSub:
"Preise und Lagerbestand werden direkt aus der Online-Datenbank geladen.",

storyTitle:
"Natürlich. Sorgfältig. Handgemacht.",

storyText:
"Bili's Natural Cosmetics ist eine Kollektion natürlicher Kosmetik mit besonderer Sorgfalt bei Rohstoffen und Herstellung.",

contactLabel:
"KONTAKT",

here:
"Wir sind für Sie da.",

warning:
"Wichtiger Hinweis:",

legal:
"Kosmetische Produkte sind keine Arzneimittel. Individuelle allergische Reaktionen sind möglich. Vor der ersten Anwendung wird ein Test auf einer kleinen Hautstelle empfohlen. Kauf und Anwendung erfolgen auf eigene Verantwortung.",

cartTitle:
"Warenkorb",

totalLabel:
"Gesamt",

nameL:
"Vor- und Nachname",

addressL:
"Adresse",

phoneL:
"Telefon",

payL:
"Zahlungsart",

noteL:
"Bemerkung",

send:
"Bestellung über WhatsApp senden",

ship:
"Versandkosten werden zusätzlich berechnet. Versand in die Schweiz, EU und weitere Länder ist möglich; Transportkosten trägt der Käufer.",

all:
"Alle",

add:
"In den Warenkorb",

available:
"Verfügbar",

none:
"Derzeit nicht verfügbar",

empty:
"Der Warenkorb ist leer."

}

};


let lang = "sr";

let all = [];

let cat = "*";

let cart =
JSON.parse(
localStorage.getItem("bilis_cart") || "[]"
);


const $ =
id =>
document.getElementById(id);


const esc =
s =>
String(s ?? "")
.replace(
/[&<>"']/g,
m => ({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"
}[m])
);


function n(p){

return (
lang === "de"
?
(p.name_de || p.name_sr)
:
(p.name_sr || p.name_de)
)
||
p.name
||
"Bili's";

}


function d(p){

return (
lang === "de"
?
(p.description_de || p.description_sr)
:
(p.description_sr || p.description_de)
)
||
p.description
||
"";

}


function c(p){

return (
lang === "de"
?
(p.category_de || p.category_sr)
:
(p.category_sr || p.category_de)
)
||
p.category
||
"";

}


function setLang(x){

lang = x;

$("sr").classList.toggle(
"on",
x === "sr"
);

$("de").classList.toggle(
"on",
x === "de"
);


for(
const k of [
"hero",
"heroText",
"see",
"prodTitle",
"prodSub",
"storyTitle",
"storyText",
"contactLabel",
"here",
"warning",
"legal",
"cartTitle",
"totalLabel",
"nameL",
"addressL",
"phoneL",
"payL",
"noteL",
"send",
"ship"
]
){

$(k).textContent =
T[x][k];

}


renderFilters();

render();

renderCart();

}


function renderFilters(){

let cs =
[
...new Set(
all
.map(c)
.filter(Boolean)
)
];


$("filters").innerHTML =

`
<button
class="${cat === "*" ? "on" : ""}"
onclick="setCat('*')">
${T[lang].all}
</button>
`

+

cs.map(
x =>
`
<button
class="${cat === x ? "on" : ""}"
onclick='setCat(${JSON.stringify(x)})'>
${esc(x)}
</button>
`
).join("");

}


function setCat(x){

cat = x;

renderFilters();

render();

}


function render(){

let list =
cat === "*"
?
all
:
all.filter(
p =>
c(p) === cat
);


$("grid").innerHTML =

list.map(
p => {

let st =
Number(
p.stock_qty ??
p.stock ??
0
);


let pr =
Number(
p.price_chf ??
p.price ??
0
);


let im =
p.image_url ||
p.image ||
"";


let size =
p.slug === "lip-balm-vanille"
?
"6 g"
:
(
p.size ||
p.volume ||
""
);


return `

<article class="card">

<div class="photo">

${
im
?
`
<img
src="${esc(im)}"
alt="${esc(n(p))}">
`
:
""
}

</div>


<div class="info">

<small class="gold">
${esc(c(p))}
</small>


<h3>
${esc(n(p))}
</h3>


<p>
${esc(d(p))}
</p>


${
size
?
`
<small>
${esc(size)}
</small>
`
:
""
}


<div class="row">

<div>

<div class="price">
${pr.toFixed(2)} CHF
</div>


<div class="stock">

${
st > 0
?
T[lang].available + " (" + st + ")"
:
T[lang].none
}

</div>

</div>


${
st > 0
?
`
<button
onclick='add(${JSON.stringify(p.id)})'>
${T[lang].add}
</button>
`
:
""
}

</div>

</div>

</article>

`;

}
).join("");

}


function add(id){

let p =
all.find(
x =>
String(x.id) === String(id)
);


let i =
cart.find(
x =>
String(x.id) === String(id)
);


let max =
Number(
p.stock_qty ??
p.stock ??
0
);


if(i){

if(i.q < max)
i.q++;

}
else{

cart.push({
id,
q:1
});

}


save();

renderCart();

cartOpen();

}


function save(){

localStorage.setItem(
"bilis_cart",
JSON.stringify(cart)
);


$("cc").textContent =
cart.reduce(
(s,x) =>
s + x.q,
0
);

}


function qty(id,z){

let i =
cart.find(
x =>
String(x.id) === String(id)
);


let p =
all.find(
x =>
String(x.id) === String(id)
);


i.q =
Math.max(
0,
Math.min(
Number(
p.stock_qty ??
p.stock ??
0
),
i.q + z
)
);


if(!i.q){

cart =
cart.filter(
x =>
String(x.id) !== String(id)
);

}


save();

renderCart();

}


function renderCart(){

let tot = 0;


if(!cart.length){

$("items").innerHTML =
`
<p>
${T[lang].empty}
</p>
`;

}
else{

$("items").innerHTML =

cart.map(
i => {

let p =
all.find(
x =>
String(x.id) === String(i.id)
);


if(!p)
return "";


let pr =
Number(
p.price_chf ??
p.price ??
0
);


tot +=
pr * i.q;


return `

<div class="cartitem">

<b>
${esc(n(p))}
</b>

<br>

${(pr * i.q).toFixed(2)} CHF

<br>

<button
onclick='qty(${JSON.stringify(i.id)},-1)'>
−
</button>

${i.q}

<button
onclick='qty(${JSON.stringify(i.id)},1)'>
+
</button>

</div>

`;

}
).join("");

}


$("total").textContent =
tot.toFixed(2);


save();

}


function cartOpen(){

$("ov").classList.add(
"open"
);

}


function cartClose(){

$("ov").classList.remove(
"open"
);

}


function sendOrder(){

if(!cart.length){

alert(
T[lang].empty
);

return;

}


if(
!$("name").value.trim()
||
!$("address").value.trim()
||
!$("phone").value.trim()
){

alert(
lang === "de"
?
"Bitte Name, Adresse und Telefon eingeben."
:
"Unesite ime, adresu i telefon."
);

return;

}


let tot = 0;

let ls = [];


cart.forEach(
i => {

let p =
all.find(
x =>
String(x.id) === String(i.id)
);


let pr =
Number(
p.price_chf ??
p.price ??
0
);


tot +=
pr * i.q;


ls.push(
`• ${n(p)} x ${i.q} = ${(pr * i.q).toFixed(2)} CHF`
);

}
);


let m =

`BILI'S NATURAL COSMETICS

${ls.join("\n")}

${T[lang].totalLabel}: ${tot.toFixed(2)} CHF
${T[lang].payL}: ${$("pay").value}

${T[lang].nameL}: ${$("name").value}
${T[lang].addressL}: ${$("address").value}
E-Mail: ${$("email").value}
${T[lang].phoneL}: ${$("phone").value}
${T[lang].noteL}: ${$("note").value || "-"}`;


window.open(
"https://wa.me/41774383916?text="
+
encodeURIComponent(m),
"_blank"
);

}


async function load(){

let {
data,
error
}
=
await db
.from("products")
.select("*")
.eq(
"active",
true
)
.order(
"sort_order",
{
ascending:true
}
);


if(error){

$("grid").textContent =
"Proizvodi trenutno nisu dostupni.";

console.error(error);

return;

}


all =
data || [];


renderFilters();

render();

renderCart();

}


$("year").textContent =
new Date().getFullYear();


save();

setLang("sr");

load();

</script>

</body>
</html>
