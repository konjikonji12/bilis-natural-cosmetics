<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Passwort zurücksetzen | Bili's Natural Cosmetics</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f6f0e5;
      color: #171717;
    }

    .header {
      background: #151515;
      color: white;
      padding: 30px 20px;
      text-align: center;
    }

    .header h1 {
      margin: 0;
      font-family: Georgia, serif;
      font-size: 38px;
      font-weight: normal;
    }

    .header p {
      margin: 8px 0 0;
      color: #c7a15a;
      letter-spacing: 4px;
      font-size: 12px;
    }

    .box {
      max-width: 420px;
      margin: 70px auto;
      padding: 30px;
      background: white;
      border-radius: 8px;
      box-sizing: border-box;
    }

    h2 {
      margin-top: 0;
      font-family: Georgia, serif;
      font-weight: normal;
      text-align: center;
      font-size: 30px;
    }

    .description {
      text-align: center;
      line-height: 1.5;
      margin-bottom: 25px;
      color: #555;
    }

    input {
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      box-sizing: border-box;
      border: 1px solid #bbb;
      border-radius: 3px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 15px;
      background: #171717;
      color: white;
      border: none;
      border-radius: 3px;
      font-size: 15px;
      letter-spacing: 1px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #message {
      margin-top: 20px;
      text-align: center;
      line-height: 1.5;
    }

    .back {
      display: block;
      margin-top: 25px;
      text-align: center;
      color: #171717;
      text-decoration: none;
    }

    @media (max-width: 500px) {
      .box {
        margin: 35px 20px;
        padding: 25px 20px;
      }
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>Bili's</h1>
    <p>NATURAL COSMETICS</p>
  </div>

  <div class="box">

    <h2>Neues Passwort</h2>

    <p class="description">
      Bitte geben Sie Ihr neues Passwort ein.
    </p>

    <input
      type="password"
      id="password"
      placeholder="Neues Passwort"
      autocomplete="new-password"
    >

    <input
      type="password"
      id="password2"
      placeholder="Passwort wiederholen"
      autocomplete="new-password"
    >

    <button id="saveButton" type="button">
      PASSWORT SPEICHERN
    </button>

    <div id="message"></div>

    <a class="back" href="./">
      Zurück zur Startseite
    </a>

  </div>

  <script>
    const SUPABASE_URL =
      "https://enzcsfhtduucagqjamnx.supabase.co";

    const SUPABASE_ANON_KEY =
      "sb_publishable_04GgoHvEKpmroJtjY-1wKA_HjEu7tC9";

    const supabaseClient = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );

    const message = document.getElementById("message");
    const saveButton = document.getElementById("saveButton");

    async function initializeRecovery() {
      try {
        const hashParams = new URLSearchParams(
          window.location.hash.substring(1)
        );

        const accessToken = hashParams.get("access_token");
        const refreshToken = hashParams.get("refresh_token");

        if (accessToken && refreshToken) {
          const { error } = await supabaseClient.auth.setSession({
            access_token: accessToken,
            refresh_token: refreshToken
          });

          if (error) {
            message.innerText =
              "Der Link ist ungültig oder abgelaufen.";
          }
        }
      } catch (error) {
        console.error(error);
      }
    }

    async function changePassword() {
      const password =
        document.getElementById("password").value;

      const password2 =
        document.getElementById("password2").value;

      message.innerText = "";

      if (password.length < 6) {
        message.innerText =
          "Das Passwort muss mindestens 6 Zeichen enthalten.";
        return;
      }

      if (password !== password2) {
        message.innerText =
          "Die Passwörter stimmen nicht überein.";
        return;
      }

      saveButton.disabled = true;
      saveButton.innerText = "BITTE WARTEN...";

      const { data: sessionData } =
        await supabaseClient.auth.getSession();

      if (!sessionData.session) {
        message.innerText =
          "Der Link zum Zurücksetzen des Passworts ist ungültig oder abgelaufen.";

        saveButton.disabled = false;
        saveButton.innerText = "PASSWORT SPEICHERN";
        return;
      }

      const { error } =
        await supabaseClient.auth.updateUser({
          password: password
        });

      if (error) {
        message.innerText =
          "Fehler: " + error.message;

        saveButton.disabled = false;
        saveButton.innerText = "PASSWORT SPEICHERN";
        return;
      }

      message.innerText =
        "Ihr Passwort wurde erfolgreich geändert.";

      saveButton.innerText =
        "PASSWORT GEÄNDERT";

      setTimeout(function () {
        window.location.href = "./";
      }, 2500);
    }

    saveButton.addEventListener(
      "click",
      changePassword
    );

    initializeRecovery();
  </script>

</body>
</html>
